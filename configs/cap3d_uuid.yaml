# Konfiguration der Cap3D-Pipeline – UUID-Testset (Pipeline 4a), für die Evaluation (Pipeline 4b)
# Wie cap3d.yaml, aber Input = data/raw/3d_assets_uuid und eigene Output-Ordner unter .../uuid/
paths:
  raw: data/raw
  renders: data/interim/uuid/renders_threejs          # Output Pipeline 2 (three.js)
  output: data/processed/uuid/cap3d

# Pipeline 1 (split_nodes) -> Pipeline 2
split:
  level: all           # mesh | group | all  (all = Einzel-Meshes + Baugruppen)
  nodes_dir: data/interim/uuid/nodes
  object_paths_pkl: data/interim/uuid/object_paths.pkl   # absolute Pfade der Teil-GLBs
  uid_mapping: data/interim/uuid/uid_mapping.json        # part_id -> {asset, node, kind, path, file, aliases, size, rel_size}

render:
  n_views: 8           # Views pro ID (alle Modi)
  resolution: 512      # Bildgröße in Pixeln
  ambient: 1.0         # Umgebungslicht (0 = aus wie im Cap3D-Original, 1 = hell); zu dunkel -> höher
  asset_glob: "data/raw/3d_assets_uuid/*.glb"
  highlight:
    context_alpha: 0.15  # Deckkraft der restlichen Teile (0 = unsichtbar, 1 = deckend)
    highlight_color: [1.0, 0.35, 0.0]
  threejs:             # Setup: bash scripts/setup_threejs.sh
    three_dir: third_party/three
    headless: true     # false = sichtbares Chromium-Fenster (nutzt sicher die GPU)
    channel: chromium  # "chromium" = neuer Headless-Modus (volles Chromium); null = Playwright-Headless-Shell
    chromium_args: ["--ignore-gpu-blocklist", "--enable-gpu", "--enable-unsafe-swiftshader"]  # letzteres = Software-Fallback ohne GPU
    supersample: 1     # 2 = in doppelter Auflösung rendern und verkleinern (glattere Kanten, dünne Teile)
    point_light: 79.6  # Blender-Standardlicht 1000 W / 4π (Candela); 0 = nur Umgebungslicht
    shadows: true      # Schatten vom Punktlicht (Cycles hat sie immer)
    ao: true           # Umgebungsverdeckung (Spalten/Innenräume dunkel wie in Cycles); nur asset/part
    ao_radius: 0.25    # Reichweite in Modell-Einheiten (Asset ist auf Größe 1 normalisiert)
    ao_intensity: 1.0  # 0 = aus, 1 = voll
    energy: blender    # blender = Glanz addiert wie Cycles/Principled v1 (heller) | three = energieerhaltend wie im VUSE-Hub
    colorspace: auto   # auto = wie Blender (asset/part linear wie DiffuRank-"Raw", highlight sRGB) | linear | srgb

caption:              # Pipeline 3, Vorversuche und Begründungen: docs/pipeline3.md
  backend: gemini      # gemini (Key in .env, siehe .env.example) | ollama (lokal)
  model: gemini-3.8-flash  # bestes Modell im Gemini-Gratis-Tarif; lokal z. B. qwen2.5vl:7b
  input_views: part+highlight  # Views aus asset | part | highlight | group, mit + kombiniert – je View ein Rasterbild der 8 Views
  grid_tile: 256       # Kantenlänge einer View im Raster (4×2 -> 1024×512 px)
  retries: 5           # bei Überlastung/Rate-Limit (HTTP 429/503) mit wachsender Wartezeit neu versuchen
  timeout: 120         # Sekunden pro Anfrage
  ollama_url: http://localhost:11434
  ollama_num_ctx: 12288  # Ollama-Standard (4096) reicht nicht für Bilder
  variant: baseline       # Standard, wenn kein --variant
  variants:
    baseline: { input_views: part+highlight, asset_name: true }
    noname: { input_views: part+highlight, asset_name: false }
    full: { input_views: asset+part+highlight+group, asset_name: true }

summarize:
  model: null          # LLM, siehe docs/research/cap3d.md
